project_id = "yprcrgkgekrplfegpwkk"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:8080"
# The invitation link of an employee leads to /mot-de-passe.
additional_redirect_urls = ["http://localhost:8080/mot-de-passe"]
# Public sign-ups are disabled: the manager account is created by hand in the
# Supabase dashboard, employees are invited by the manager (inviter-employe).
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[functions.envoyer-sms]
# The function checks the caller itself (see index.ts).
verify_jwt = false

[functions.inviter-employe]
# The function checks the caller itself: manager profile only (see index.ts).
verify_jwt = false
