project_id = "yprcrgkgekrplfegpwkk"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:8080"
# The invitation link of an employee leads to /mot-de-passe.
additional_redirect_urls = ["http://localhost:8080/mot-de-passe"]
# Public sign-ups are disabled: the manager account is created by hand in the
# Supabase dashboard, employees are invited by the manager (inviter-employe).
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.sms]
# Enable the phone provider; auth.enable_signup above still forbids public sign-ups.
enable_signup = true
enable_confirmations = true
max_frequency = "60s"

# Local only. Never configure these fixed codes on the production project.
[auth.sms.test_otp]
33639989901 = "123456"
33639989902 = "654321"

# CLI requires an enabled provider even with test_otp and a Send SMS hook.
# Inert local placeholders: the SQL hook replaces this provider entirely.
[auth.sms.twilio]
enabled = true
account_sid = "local-unused"
message_service_sid = "local-unused"
auth_token = "local-unused"

[auth.hook.send_sms]
enabled = true
uri = "pg-functions://postgres/public/sms_client_auth_hook"

[functions.demander-code-client]
verify_jwt = false

[functions.envoyer-sms]
# The function checks the caller itself (see index.ts).
verify_jwt = false

[functions.inviter-employe]
# The function checks the caller itself: manager profile only (see index.ts).
verify_jwt = false
